<!doctype html><html lang="en" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Race"><meta name="theme-color" content="#3b1d8f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Reading Race</title>
<style>
@font-face{font-family:"Heb";src:url(hebrew.ttf)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;font-family:"Heb","Arial Hebrew",sans-serif;background:linear-gradient(#5b2bd6,#2a8cf0);color:#fff;overflow:hidden}
button{font-family:inherit;border:0;border-radius:24px;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 20px 20px}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:14px;font-size:30px;padding:12px 0}
.top .sp{flex:1}.pill{background:#0003;border-radius:30px;padding:6px 18px}
#map{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-content:flex-start;padding:10px 0 40px}
.lv{width:150px;height:150px;border-radius:50%;background:#ffd23f;color:#3b1d8f;font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 #c79a00;text-align:center;line-height:1.1;padding:10px;position:relative}
.lv b{font-size:40px}.lv.boss{background:#ff5d73;color:#fff;box-shadow:0 8px 0 #b3203a;width:180px;height:180px}
.lv.lock{background:#9aa;box-shadow:0 8px 0 #677;opacity:.7}.lv .st{font-size:24px;letter-spacing:2px}
#track{position:relative;height:30px;background:repeating-linear-gradient(90deg,#fff3 0 20px,#fff1 20px 40px);border-radius:15px;margin:2px 0 6px}
#track .fin{position:absolute;left:4px;top:0;font-size:24px}
.car{position:absolute;top:-6px;font-size:34px;transition:right .35s cubic-bezier(.3,1.6,.5,1);transform:scaleX(-1)}
.car.ghost{opacity:.35;filter:grayscale(1)}.car.turbo::after{content:"🔥";position:absolute;right:-24px;top:4px;font-size:24px}
#board.pg{background:#fff;padding:4px;display:block;text-align:center}
#board{flex:1;background:#fffdf5;color:#222;border-radius:30px;overflow-y:auto;padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;justify-content:flex-start;direction:rtl}
.u{font-size:64px;min-width:100px;text-align:center;border-radius:18px;padding:4px 12px;transition:all .2s}
#board.words .u{font-size:50px;min-width:0}
.u.done{color:#2bb24c}.u.cur{background:#fff27a;box-shadow:0 0 0 6px #ffb800,0 0 30px #ffb800;transform:scale(1.15)}
.u.help{background:#ffd0d8;box-shadow:0 0 0 6px #ff5d73}.u.shake{animation:sh .4s}
.page{position:relative;margin:0 auto;overflow:hidden;background:#fff}
.page img{position:absolute;max-width:none;pointer-events:none}
.bx{position:absolute;border-radius:10px;transition:all .15s}
.bx.cur{background:rgba(255,230,0,.38);box-shadow:0 0 0 4px #ffb800,0 0 22px 6px rgba(255,184,0,.8);mix-blend-mode:multiply}
.bx.done{border-bottom:5px solid rgba(43,178,76,.75)}
.bx.help{background:rgba(255,93,115,.25);box-shadow:0 0 0 4px #ff5d73}
.bx.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.u .s{border-bottom:5px solid transparent}.u .s.sc{border-color:#ffb800}
#hud{display:flex;gap:14px;font-size:34px;align-items:center;padding-bottom:6px}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:260px;background:#0006;z-index:5}
.big{font-size:44px;padding:20px 50px;background:#2bd66b;color:#fff;box-shadow:0 8px 0 #179447}
.modal{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:6}
.card{background:#fff;color:#3b1d8f;border-radius:36px;padding:30px 40px;text-align:center;font-size:32px;max-width:90%;max-height:90%;overflow:auto}
#ovx{position:absolute;left:68px;bottom:6px;width:56px;height:56px;border-radius:50%;background:#fff2;font-size:26px;color:#fff6;z-index:4}
#ovr{position:absolute;left:6px;bottom:6px;width:56px;height:56px;border-radius:50%;background:#fff2;font-size:26px;color:#fff6;z-index:4}
#mic{font-size:34px}.mic-on{animation:pu 1.2s infinite}@keyframes pu{50%{opacity:.4}}
.chars{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}.chars button{font-size:60px;background:#eee;padding:10px 20px}
.chars button.sel{background:#ffd23f}
#ch{background:#f4f0ff;border-radius:16px}
.lv .rec{font-size:18px}
#spTrack{position:relative;height:30px;background:repeating-linear-gradient(90deg,#fff3 0 20px,#fff1 20px 40px);border-radius:15px;margin:2px 0 6px}
#spTrack .fin{position:absolute;left:4px;top:0;font-size:24px}
#spBoard{flex:1;background:#fff;border-radius:30px;overflow:auto;padding:4px;text-align:center}
#spTimer{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);font-size:64px;font-weight:bold;background:#0006;border-radius:30px;padding:0 30px;font-variant-numeric:tabular-nums;z-index:3}
#spTimer.behind{color:#ffb3bd}
#spGo{position:absolute;inset:0;margin:auto;width:340px;height:340px;border-radius:50%;background:#2bd66b;color:#fff;font-size:110px;box-shadow:0 14px 0 #179447,0 0 0 18px #fff6;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;animation:bob 1.2s ease-in-out infinite}
#spGo span,#spStop span{font-size:46px}
#spBar{display:flex;align-items:center;gap:20px;height:130px;padding-top:10px;direction:ltr}
#spStop{width:420px;height:115px;border-radius:60px;background:#ff5d73;color:#fff;font-size:80px;box-shadow:0 12px 0 #b3203a;visibility:hidden;display:flex;gap:20px;align-items:center;justify-content:center;z-index:4}
#spX{width:200px;height:115px;border-radius:60px;background:#fff;color:#ff5d73;font-size:46px;font-weight:bold;box-shadow:0 8px 0 #ccc;z-index:4}
#spMist.over{color:#b3203a}
.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.3)}}
@keyframes bob{50%{transform:scale(1.06)}}
.banner{font-size:56px;background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#fff;border-radius:24px;padding:6px 20px;animation:pop .6s 3;text-shadow:0 3px 0 #b86b00}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:24px;margin:10px 0}
.cmp .bar{background:#eee;border-radius:12px;height:26px;overflow:hidden;direction:rtl}.cmp .bar span{display:block;height:100%;border-radius:12px}
#count.pop{animation:pop .5s}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:7}

html,body{background:radial-gradient(circle at 70% 0%,#7b4dff 0,#5b2bd6 35%,#2a8cf0 100%);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.pill{backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 #fff3,0 4px 10px #0003}
.lv{background:radial-gradient(circle at 35% 25%,#fff6a8 0,#ffd23f 45%,#f5b800 100%);box-shadow:0 8px 0 #c79a00,0 14px 24px #0004,inset 0 -6px 0 #0001;transition:transform .15s}
.lv:active{transform:translateY(6px) scale(.97)}
.lv.boss{background:radial-gradient(circle at 35% 25%,#ffb3be 0,#ff5d73 50%,#e0334f 100%)}
.lv.lock{background:radial-gradient(circle at 35% 25%,#cfd6dd,#9aa7b3)}
.lv:not(.lock):not(.done1){animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 0 #c79a00,0 0 30px 8px #fff7}}
.car{transform:none!important}.carsvg{width:56px;height:36px;display:block;filter:drop-shadow(0 3px 2px #0005)}
.big{transition:transform .1s}.big:active{transform:translateY(6px)}
#ptsP,#ptsR,#spPts{background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#5a2a00;font-weight:bold;text-shadow:0 1px 0 #fff8}
.fly{position:fixed;z-index:9;pointer-events:none;font-size:40px;font-weight:bold;color:#ffd23f;text-shadow:0 3px 0 #b86b00,0 0 12px #fff;animation:fly 1s ease-out forwards;direction:ltr}
@keyframes fly{to{transform:translateY(-90px) scale(1.4);opacity:0}}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9;pointer-events:none;font-size:90px;font-weight:900;color:#fff;-webkit-text-stroke:3px #ff5d73;animation:cmb .9s ease-out forwards}
@keyframes cmb{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.shk{animation:shk .5s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,0)}}
.ptsbig{font-size:60px;font-weight:900;color:#ff9f1c;text-shadow:0 4px 0 #b86b00}
.pill,.card,.top>span,.cmp>div,.big{direction:ltr;unicode-bidi:isolate;white-space:nowrap}.cmp .bar{direction:rtl}
.top{font-size:22px;gap:8px;flex-wrap:nowrap}.top .pill{padding:6px 12px}.top>span:first-child{font-size:26px}
</style></head><body>
<div id="sMap" class="screen on">
 <div class="top"><span>🏁 Reading Race</span><span class="sp"></span><span class="pill" id="streakP">🔥 0</span><span class="pill" id="coinsP">🪙 0</span><span class="pill" id="ptsP">⭐ 0 pts</span>
 <button class="pill" style="font-size:28px;color:#fff;background:#ff9f1c" id="modeB">🏁</button><button class="pill" style="font-size:30px;color:#fff" onclick="openChars()" id="charB"><svg class="carsvg" viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg"><path d="M4 26 Q4 18 12 17 L20 8 Q23 5 28 5 L44 5 Q50 5 53 10 L58 17 Q62 18 62 24 L62 29 Q62 31 60 31 L6 31 Q4 31 4 29Z" fill="#e63946" stroke="#a4161a" stroke-width="1.5"/><path d="M22 10 Q24 8 28 8 L34 8 L34 17 L15 17Z M37 8 L44 8 Q48 8 50 11 L54 17 L37 17Z" fill="#bfe9ff"/><rect x="4" y="21" width="5" height="4" rx="2" fill="#ffe066"/><circle cx="17" cy="31" r="7" fill="#222"/><circle cx="17" cy="31" r="3" fill="#ccc"/><circle cx="49" cy="31" r="7" fill="#222"/><circle cx="49" cy="31" r="3" fill="#ccc"/></svg></button>
 <button class="pill" style="font-size:22px;color:#fff" id="parentB">👨 Parent</button></div>
 <div id="map"></div></div>
<div id="sPlay" class="screen">
 <div id="hud"><button class="pill" style="color:#fff;font-size:30px" onclick="quit()">✖</button><span class="pill" id="timer">0.0</span>
 <span class="pill" id="streak">⚡ 0</span><span class="pill" id="coinsR">🪙 0</span><span class="pill" id="ptsR">⭐ 0</span><span class="sp" style="flex:1"></span><span id="mic">🎤</span><span id="title" style="font-size:30px"></span></div>
 <div id="track"><span class="fin">🏁</span></div>
 <div id="board"></div>
 <button id="ovr" title="parent">✓</button><button id="ovx" title="parent">✗</button>
 <div id="count"></div></div>
<div id="sSpeed" class="screen">
 <div id="hud"><button class="pill" style="color:#fff;font-size:30px" id="spQuit">✖</button><span class="pill" id="spBest" style="font-size:30px">🏆</span><span class="pill" id="spPts" style="font-size:30px">⭐ 0</span><span style="flex:1"></span><span id="spTitle" style="font-size:30px"></span></div>
 <div id="spTrack"><span class="fin">🏁</span><span id="spGhost" class="car ghost"></span></div>
 <div id="spBoard" class="pg"></div>
 <div id="spTimer">0.0</div>
 <button id="spGo">▶ <span>START</span></button>
 <div id="spBar"><button id="spX"><span id="spMist">✗ 0</span></button><span style="flex:1"></span><button id="spStop">⏹ <span>DONE!</span></button></div>
</div>
<div class="modal" id="modal"><div class="card" id="card"></div></div>
<canvas id="confetti"></canvas>
<script src="levels.js"></script><script src="app.js"></script>
</body></html>
